<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-tag-input: chip and tag input for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151B4D"/>
      <stop offset="1" stop-color="#2A3486"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#060A2A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="260" fill="#3A46A8" opacity="0.35"/>
  <circle cx="120" cy="540" r="200" fill="#3A46A8" opacity="0.3"/>

  <!-- Title block -->
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="148" font-size="50" font-weight="800" fill="#FFFFFF">compose-tag-input</text>
    <text x="74" y="198" font-size="23" fill="#CFD4FF">Chip and tag input for Jetpack Compose</text>
    <text x="74" y="232" font-size="23" fill="#CFD4FF">on phones and tablets</text>

    <g font-size="16" font-weight="600">
      <rect x="72" y="272" width="156" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="150" y="297" text-anchor="middle" fill="#EEF0FF">Autocomplete</text>
      <rect x="240" y="272" width="130" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="305" y="297" text-anchor="middle" fill="#EEF0FF">Validation</text>
      <rect x="382" y="272" width="128" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="446" y="297" text-anchor="middle" fill="#EEF0FF">Separators</text>
      <rect x="72" y="322" width="120" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="132" y="347" text-anchor="middle" fill="#EEF0FF">Max tags</text>
      <rect x="204" y="322" width="176" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="292" y="347" text-anchor="middle" fill="#EEF0FF">Paste splitting</text>
      <rect x="392" y="322" width="118" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="451" y="347" text-anchor="middle" fill="#EEF0FF">Keyboard</text>
      <rect x="72" y="372" width="196" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="170" y="397" text-anchor="middle" fill="#EEF0FF">Avatars and icons</text>
      <rect x="280" y="372" width="148" height="38" rx="19" fill="#26307A" stroke="#BAC3FF" stroke-opacity="0.5"/>
      <text x="354" y="397" text-anchor="middle" fill="#EEF0FF">Accessibility</text>
    </g>
    <text x="74" y="452" font-size="18" fill="#BAC3FF">Comma · Space · Enter · Backspace · Arrows · Escape</text>
  </g>

  <!-- Illustration: a form card with a chip field and an open suggestion list -->
  <g transform="translate(640 72)">
    <rect x="0" y="0" width="560" height="416" rx="28" fill="#FBF8FF" filter="url(#shadow)"/>
    <!-- heading placeholder -->
    <rect x="36" y="34" width="168" height="16" rx="8" fill="#1B1B21"/>
    <rect x="36" y="62" width="104" height="10" rx="5" fill="#A0A0AE"/>

    <!-- field label -->
    <rect x="40" y="98" width="44" height="10" rx="5" fill="#4A57A9"/>
    <!-- focused field -->
    <rect x="36" y="116" width="488" height="104" rx="14" fill="#FFFFFF" stroke="#4A57A9" stroke-width="3"/>

    <!-- avatar chip 1 -->
    <rect x="52" y="132" width="150" height="32" rx="16" fill="#E0E1F9"/>
    <circle cx="68" cy="148" r="12" fill="#3F51B5"/>
    <rect x="88" y="143" width="84" height="10" rx="5" fill="#2D2F42"/>
    <path d="M182 142 l12 12 M194 142 l-12 12" stroke="#2D2F42" stroke-width="2.4" stroke-linecap="round"/>

    <!-- avatar chip 2 -->
    <rect x="212" y="132" width="132" height="32" rx="16" fill="#E0E1F9"/>
    <circle cx="228" cy="148" r="12" fill="#00796B"/>
    <rect x="248" y="143" width="66" height="10" rx="5" fill="#2D2F42"/>
    <path d="M324 142 l12 12 M336 142 l-12 12" stroke="#2D2F42" stroke-width="2.4" stroke-linecap="round"/>

    <!-- selected chip -->
    <rect x="354" y="132" width="154" height="32" rx="16" fill="#4A57A9"/>
    <circle cx="370" cy="148" r="12" fill="#C2185B"/>
    <rect x="390" y="143" width="88" height="10" rx="5" fill="#FFFFFF"/>
    <path d="M488 142 l12 12 M500 142 l-12 12" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>

    <!-- outlined chip with a star -->
    <rect x="52" y="174" width="124" height="32" rx="8" fill="none" stroke="#767680" stroke-width="1.6"/>
    <path d="M70 180 l3.6 7.4 8.1 1.2 -5.9 5.7 1.4 8 -7.2 -3.8 -7.2 3.8 1.4 -8 -5.9 -5.7 8.1 -1.2z" fill="#46464F"/>
    <rect x="88" y="185" width="70" height="10" rx="5" fill="#46464F"/>

    <!-- typed text and caret -->
    <rect x="190" y="184" width="46" height="12" rx="6" fill="#1B1B21"/>
    <rect x="242" y="179" width="3" height="22" rx="1.5" fill="#4A57A9"/>

    <!-- suggestion dropdown -->
    <rect x="36" y="232" width="488" height="152" rx="14" fill="#EFEDF4" stroke="#DADAE6"/>
    <rect x="46" y="242" width="468" height="40" rx="9" fill="#E0E1F9"/>
    <rect x="62" y="257" width="42" height="11" rx="5.5" fill="#4A57A9"/>
    <rect x="108" y="257" width="118" height="11" rx="5.5" fill="#3D3D48"/>
    <rect x="62" y="303" width="42" height="11" rx="5.5" fill="#4A57A9"/>
    <rect x="108" y="303" width="96" height="11" rx="5.5" fill="#3D3D48"/>
    <rect x="62" y="349" width="70" height="11" rx="5.5" fill="#3D3D48"/>
    <rect x="136" y="349" width="42" height="11" rx="5.5" fill="#4A57A9"/>
  </g>

  <!-- error hint card -->
  <g transform="translate(980 448)">
    <rect x="0" y="0" width="236" height="56" rx="16" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="30" cy="28" r="12" fill="#BA1A1A"/>
    <rect x="28.5" y="20" width="3" height="10" rx="1.5" fill="#FFFFFF"/>
    <circle cx="30" cy="34" r="1.8" fill="#FFFFFF"/>
    <rect x="54" y="22" width="150" height="12" rx="6" fill="#BA1A1A" opacity="0.85"/>
  </g>
</svg>
